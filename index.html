<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* the clear code. brand — see brand/BRAND.md */
      @font-face {
        font-family: "Source Serif 4";
        font-weight: 900;
        font-style: normal;
        src: url("assets/fonts/source-serif-4-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Serif 4";
        font-weight: 900;
        font-style: italic;
        src: url("assets/fonts/source-serif-4-latin-900-italic.woff2") format("woff2");
      }
      :root {
        --brand-red: #ae1f14;
        --brand-cream: #f2f0e0;
        --brand-pink: #ffd7de;
        --brand-white: #ffffff;
        --ground: var(--brand-red);
        --ink: var(--brand-pink);
        --font-display: "Source Serif 4", serif;
        --font-body: "Outfit", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      #logo {
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 150px;
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      #tagline {
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="card">
        <h1 id="logo">the clear code.</h1>
        <p id="tagline">bye bye, acne</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Logo is on screen from frame 0 (it is the thumbnail); it settles in, then the tagline arrives.
      tl.fromTo("#logo", { scale: 0.94 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
