<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Source Serif 4";font-weight:900;src:url(source-serif-4-latin-900-normal.woff2)}
@font-face{font-family:"Source Serif 4";font-weight:900;font-style:italic;src:url(source-serif-4-latin-900-italic.woff2)}
@font-face{font-family:"Outfit";font-weight:600;src:url(outfit-600.woff2)}
:root{--red:#ae1f14;--cream:#f2f0e0;--pink:#ffd7de;--hair:rgba(242,240,224,.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover}
.shade{position:absolute;left:0;right:0;bottom:0;height:1100px;background:linear-gradient(to bottom,rgba(20,8,6,0),rgba(20,8,6,.55) 55%,rgba(20,8,6,.7))}
.panel{position:absolute;left:70px;right:70px;top:1090px;background:var(--red);color:var(--cream);border-radius:6px;padding:44px 56px 52px;
 box-shadow:0 18px 50px rgba(40,6,4,.35);text-align:center}
.panel::after{content:"";position:absolute;inset:12px;border:1.5px solid var(--hair);border-radius:3px}
.eyebrow{font:600 32px "Outfit";letter-spacing:.22em;text-transform:uppercase;color:var(--pink);margin-bottom:18px}
.title{font:900 92px/1.0 "Source Serif 4";letter-spacing:-0.05em}
.title em{font-style:italic;color:var(--pink)}
.mark{position:absolute;left:50%;transform:translateX(-50%);top:1520px;font:900 46px "Source Serif 4";color:var(--cream);letter-spacing:-.04em;opacity:.9}
</style></head><body><div class="bg"></div><div class="shade"></div>
<div class="panel"><div class="eyebrow">4 reasons</div><div class="title">Why skincare evidence is <em>so hard</em> to find.</div></div>
<div class="mark">the clear code.</div>
</body></html>
